<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found</title>
  <script>
  // Case-insensitive redirects for package sites
  (function() {
    var packages = [
      'BiHeat',
      'texanshootR',
      'INLAocc',
      'tulpaMesh',
      'restrictR',
      'SIMP',
      'areaOfEffect'
    ];
    var path = window.location.pathname;
    for (var i = 0; i < packages.length; i++) {
      var name = packages[i];
      if (path.indexOf('/' + name) === 0) return;
      if (new RegExp('^/' + name + '\\b', 'i').test(path)) {
        var newPath = path.replace(new RegExp('^/' + name, 'i'), '/' + name);
        window.location.replace(newPath + window.location.search + window.location.hash);
        return;
      }
    }
  })();
  </script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: #f5f5f5;
    }
    .container {
      text-align: center;
      padding: 2rem;
    }
    h1 { color: #333; }
    p { color: #666; }
    a { color: #4183c4; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Page not found</h1>
    <p>The page you're looking for doesn't exist.</p>
    <p><a href="/">Return to homepage</a></p>
  </div>
</body>
</html>
