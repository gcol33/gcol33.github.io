<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found</title>
  <script>
  // Case-insensitive redirect into any project site of the account: the first
  // path segment is matched against the names of repositories that publish Pages,
  // and the rest of the path, the query and the hash are kept.
  (function() {
    var path = window.location.pathname;
    var segment = path.split('/')[1];
    if (!segment) return;
    var wanted = segment.toLowerCase();
    var rest = path.slice(1 + segment.length);
    function scan(page) {
      fetch('https://api.github.com/users/gcol33/repos?per_page=100&page=' + page)
        .then(function(r) { return r.ok ? r.json() : []; })
        .then(function(repos) {
          for (var i = 0; i < repos.length; i++) {
            var name = repos[i].name;
            if (!repos[i].has_pages || name.toLowerCase() !== wanted) continue;
            if (name !== segment) {
              window.location.replace('/' + name + rest + window.location.search + window.location.hash);
            }
            return;
          }
          if (repos.length === 100) scan(page + 1);
        })
        .catch(function() {});
    }
    scan(1);
  })();
  </script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: #f5f5f5;
    }
    .container {
      text-align: center;
      padding: 2rem;
    }
    h1 { color: #333; }
    p { color: #666; }
    a { color: #4183c4; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Page not found</h1>
    <p>The page you're looking for doesn't exist.</p>
    <p><a href="/">Return to homepage</a></p>
  </div>
</body>
</html>
