{% assign image_key = include.src_webp | default: include.src %}
{% assign variants = site.data.responsive_images[image_key] %}
<picture>
  {% if variants %}
  <source type="image/webp" srcset="{% for variant in variants %}{{ variant.url | relative_url }} {{ variant.width }}w{% unless forloop.last %}, {% endunless %}{% endfor %}" sizes="{{ include.sizes | default: '(max-width: 767px) calc(100vw - 40px), (max-width: 991px) 340px, 400px' }}">
  {% elsif include.src_webp %}
  <source type="image/webp" srcset="{{ include.src_webp | relative_url }}">
  {% endif %}
  <img src="{{ include.src | relative_url }}" class="{{ include.class | default: 'img-fluid mx-auto d-block' | remove: 'lazyload' }}" alt="{{ include.alt | escape }}"{% if include.width %} width="{{ include.width }}"{% endif %}{% if include.height %} height="{{ include.height }}"{% endif %} loading="{{ include.loading | default: 'lazy' }}" decoding="async"{% if include.priority %} fetchpriority="{{ include.priority }}"{% endif %}>
</picture>
