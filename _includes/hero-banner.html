<div class="section {{ include.classes | default: 'section-dark hero-dark' }}" id="{{ include.id | default: 'hero-img' }}">
  <div class="shape-divider divider-bottom">
    <svg class="svg-divider section-divider-b-0-fill" fill-rule="evenodd" preserveAspectRatio="none" viewBox="0 0 1000 250">
      <path d="M1000,0V250H0v-1Z"></path>
    </svg>
  </div>
  <div class="container hero-container">
    <div class="row">
      <div class="{{ include.col_class | default: 'col-12' }}">
        {{ include.content }}
      </div>
    </div>
  </div>
</div>
