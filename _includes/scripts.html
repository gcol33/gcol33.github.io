<script>
  // Copy citation functionality
  document.addEventListener('DOMContentLoaded', function() {
    document.querySelectorAll('.copy-btn').forEach(function(btn) {
      btn.addEventListener('click', function() {
        var text = this.closest('.citation-box').querySelector('.citation-text').textContent;
        navigator.clipboard.writeText(text).then(function() {
          btn.classList.add('copied');
          btn.innerHTML = '<i class="fas fa-check"></i>';
          setTimeout(function() {
            btn.classList.remove('copied');
            btn.innerHTML = '<i class="far fa-copy"></i>';
          }, 2000);
        });
      });
    });
  });
</script>

<script>
  // Theme toggle functionality
  (function() {
    var toggleBtn = document.querySelector('.theme-toggle');
    if (toggleBtn) {
      toggleBtn.addEventListener('click', function() {
        var currentTheme = document.documentElement.getAttribute('data-bs-theme');
        var newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-bs-theme', newTheme);
        localStorage.setItem('theme', newTheme);
      });
    }
  })();

  // Navbar dropdowns: hover-open is suppressed while a menu is open by click.
  // The class follows the menus' actual .show state after each transition.
  (function() {
    var nav = document.querySelector('.hover-open-submenu');
    if (!nav) return;

    function sync() {
      nav.classList.toggle('dropdown-clicked', !!nav.querySelector('.dropdown-menu.show'));
    }

    nav.addEventListener('shown.bs.dropdown', sync);
    nav.addEventListener('hidden.bs.dropdown', function(e) {
      sync();
      // A menu closed while the pointer is over its item stays closed until the pointer leaves
      var item = e.target.closest('.dropdown');
      if (item && item.matches(':hover')) item.classList.add('hover-closed');
    });
    // A click on a toggle whose menu is showing only because of hover closes it
    window.addEventListener('click', function(e) {
      var toggle = e.target.closest('.hover-open-submenu .dropdown-toggle');
      if (!toggle || !window.matchMedia('(hover: hover)').matches) return;
      var menu = toggle.nextElementSibling;
      if (!menu || menu.classList.contains('show') || menu.offsetParent === null) return;
      e.preventDefault();
      e.stopPropagation();
      toggle.closest('.dropdown').classList.add('hover-closed');
    }, true);
    nav.addEventListener('mouseout', function(e) {
      var item = e.target.closest('.dropdown');
      if (item && !item.contains(e.relatedTarget)) item.classList.remove('hover-closed');
    });
  })();

  // The slide-out drawer is pinned open at a fixed 300px, so a window growing
  // past the navbar breakpoint lays its links out in a row inside that strip
  // and clips them. Hand the close back to the nav's own handler.
  (function() {
    var toggle = document.getElementById('nav-toggle');
    if (!toggle) return;

    window.addEventListener('resize', function() {
      var navbarExpanded = toggle.offsetParent === null;
      var closeBtn = document.querySelector('.close-special-menu');
      if (navbarExpanded && closeBtn) {
        closeBtn.dispatchEvent(new MouseEvent('mousedown', { bubbles: true }));
      }
    });
  })();

  // Scroll-to-top button: hide when scrolling up
  (function() {
    var scrollBtn = document.querySelector('.scrollToTop');
    if (!scrollBtn) return;

    var lastScrollY = window.scrollY;
    var hideTimeout = null;
    var showThreshold = 300; // Show button after scrolling this far

    window.addEventListener('scroll', function() {
      var currentScrollY = window.scrollY;

      // Clear any pending hide timeout
      if (hideTimeout) {
        clearTimeout(hideTimeout);
        hideTimeout = null;
      }

      // If near top, hide immediately
      if (currentScrollY < showThreshold) {
        scrollBtn.style.opacity = '0';
        scrollBtn.style.pointerEvents = 'none';
      }
      // If scrolling down and past threshold, show
      else if (currentScrollY > lastScrollY) {
        scrollBtn.style.opacity = '1';
        scrollBtn.style.pointerEvents = 'auto';
      }
      // If scrolling up, hide after short delay
      else if (currentScrollY < lastScrollY) {
        hideTimeout = setTimeout(function() {
          scrollBtn.style.opacity = '0';
          scrollBtn.style.pointerEvents = 'none';
        }, 500);
      }

      lastScrollY = currentScrollY;
    });

    // Add transition for smooth fade
    scrollBtn.style.transition = 'opacity 0.3s ease';
  })();
</script>
